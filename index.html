<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image → Digital Code Flow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #00ff9d, #00c3ff, #ff00e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  .subtitle {
    color: #888;
    font-size: 0.95rem;
    margin-bottom: 25px;
    text-align: center;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
    background: #12121a;
    padding: 18px 25px;
    border-radius: 12px;
    border: 1px solid #2a2a3a;
  }

  label {
    font-size: 0.9rem;
    color: #aaa;
  }

  input[type="file"] {
    color: #ccc;
    font-size: 0.9rem;
  }

  input[type="range"] {
    width: 120px;
    accent-color: #00ff9d;
  }

  button {
    background: linear-gradient(90deg, #00c853, #00b0ff);
    color: #000;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }

  button:hover {
    transform: scale(1.05);
  }

  button:active {
    transform: scale(0.97);
  }

  #canvasContainer {
    position: relative;
    background: #050508;
    border: 1px solid #1e1e2e;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 255, 157, 0.08);
  }

  canvas {
    display: block;
    max-width: 100%;
  }

  .hint {
    margin-top: 18px;
    color: #666;
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>IMAGE → DIGITAL CODE FLOW</h1>
  <p class="subtitle">Upload any image • Watch it transform into flowing colored code</p>

  <div class="controls">
    <div>
      <label>Select Image</label><br>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div>
      <label>Density</label><br>
      <input type="range" id="density" min="4" max="16" value="9">
    </div>

    <div>
      <label>Speed</label><br>
      <input type="range" id="speed" min="1" max="20" value="8">
    </div>

    <button id="startBtn">Start Effect</button>
  </div>

  <div id="canvasContainer">
    <canvas id="canvas"></canvas>
  </div>

  <p class="hint">Tip: Higher density = more detail • Lower density = bigger characters</p>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const imageInput = document.getElementById('imageInput');
  const densitySlider = document.getElementById('density');
  const speedSlider = document.getElementById('speed');
  const startBtn = document.getElementById('startBtn');

  let img = null;
  let animationId = null;
  let columns = [];
  let fontSize = 9;
  let chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン{}[]();=<>+-*/&|!\~%$#@";

  // Load image
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      img = new Image();
      img.onload = () => {
        // Limit max size for performance
        const maxW = 900;
        const maxH = 700;
        let w = img.width;
        let h = img.height;

        if (w > maxW) {
          h = Math.round(h * (maxW / w));
          w = maxW;
        }
        if (h > maxH) {
          w = Math.round(w * (maxH / h));
          h = maxH;
        }

        canvas.width = w;
        canvas.height = h;
        cancelAnimationFrame(animationId);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  startBtn.addEventListener('click', () => {
    if (!img) {
      alert("Please select an image first!");
      return;
    }
    startEffect();
  });

  function startEffect() {
    cancelAnimationFrame(animationId);

    fontSize = parseInt(densitySlider.value);
    const cols = Math.floor(canvas.width / fontSize);
    const rows = Math.floor(canvas.height / fontSize);

    // Sample the image colors
    const offscreen = document.createElement('canvas');
    offscreen.width = cols;
    offscreen.height = rows;
    const octx = offscreen.getContext('2d');
    octx.drawImage(img, 0, 0, cols, rows);
    const imageData = octx.getImageData(0, 0, cols, rows).data;

    // Create columns (matrix style)
    columns = [];
    for (let i = 0; i < cols; i++) {
      columns.push({
        y: Math.random() * rows,
        speed: 0.3 + Math.random() * 1.5,
        chars: []
      });

      // Pre-fill characters for this column
      for (let j = 0; j < rows + 20; j++) {
        columns[i].chars.push(chars[Math.floor(Math.random() * chars.length)]);
      }
    }

    function draw() {
      // Slight trail effect
      ctx.fillStyle = 'rgba(5, 5, 10, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px 'Share Tech Mono', monospace`;
      ctx.textAlign = 'center';

      const speedMult = parseInt(speedSlider.value) / 8;

      for (let i = 0; i < columns.length; i++) {
        const col = columns[i];
        col.y += col.speed * speedMult;

        // Reset when it goes far enough
        if (col.y > rows + 30) {
          col.y = -Math.random() * 40;
          col.speed = 0.3 + Math.random() * 1.8;
        }

        for (let j = 0; j < rows + 15; j++) {
          const yPos = Math.floor(col.y - j);
          if (yPos < 0 || yPos >= rows) continue;

          // Get original pixel color
          const idx = (yPos * cols + i) * 4;
          const r = imageData[idx];
          const g = imageData[idx + 1];
          const b = imageData[idx + 2];
          const a = imageData[idx + 3];

          if (a < 30) continue; // skip almost transparent

          // Brightness boost for the leading character
          const brightness = j === 0 ? 1.4 : 1 - (j * 0.07);
          const finalR = Math.min(255, Math.floor(r * brightness));
          const finalG = Math.min(255, Math.floor(g * brightness));
          const finalB = Math.min(255, Math.floor(b * brightness));

          ctx.fillStyle = `rgb(\( {finalR}, \){finalG},${finalB})`;

          // Occasionally change the character for "flowing" feel
          if (Math.random() < 0.03) {
            col.chars[j] = chars[Math.floor(Math.random() * chars.length)];
          }

          const char = col.chars[j] || chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(char, i * fontSize + fontSize / 2, yPos * fontSize + fontSize);
        }
      }

      animationId = requestAnimationFrame(draw);
    }

    draw();
  }
</script>
</body>
</html>
