<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowing Code Image Art</title>
<style>
  :root {
    --bg: #05060a;
    --panel: #101420;
    --accent: #00ffd5;
    --text: #d7e0ea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #0b1220 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4vw, 34px);
    background: linear-gradient(90deg, #00ffd5, #7b5cff, #ff4fd8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.subtitle {
    margin: 0 0 18px;
    opacity: .75;
    text-align: center;
    font-size: 14px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    background: rgba(16, 20, 32, .8);
    border: 1px solid rgba(0, 255, 213, .18);
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 18px;
  }

  input[type="file"] { display: none; }

  button, label.btn {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
    color: #04121a;
    background: linear-gradient(135deg, #00ffd5, #4ce0ff);
    transition: transform .15s ease, filter .15s ease;
  }

  button:hover, label.btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
  }

  button.secondary {
    color: var(--text);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
  }

  .slider {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }

  input[type="range"] {
    accent-color: var(--accent);
    width: 130px;
  }

  .canvas-wrap {
    width: min(1100px, 96vw);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(0,255,213,.2);
    background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .hint {
    margin-top: 12px;
    font-size: 12px;
    opacity: .6;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>Flowing Code Image Art</h1>
  <p class="subtitle">Upload any image — it becomes animated, colorful code characters in the image’s own colors.</p>

  <div class="controls">
    <label class="btn" for="imageInput">Choose Image</label>
    <input id="imageInput" type="file" accept="image/*">

    <div class="slider">
      <span>Detail</span>
      <input id="detail" type="range" min="3" max="18" value="8">
      <span id="detailValue">8</span>
    </div>

    <div class="slider">
      <span>Flow Speed</span>
      <input id="speed" type="range" min="0" max="10" value="4">
      <span id="speedValue">4</span>
    </div>

    <button id="pauseBtn" class="secondary">Pause</button>
    <button id="downloadBtn" class="secondary">Download PNG</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="artCanvas"></canvas>
  </div>

  <p class="hint">Tip: increase <b>Detail</b> for sharper images; decrease it for larger, more visible code characters.</p>

<script>
const imageInput = document.getElementById("imageInput");
const detailSlider = document.getElementById("detail");
const speedSlider = document.getElementById("speed");
const detailValue = document.getElementById("detailValue");
const speedValue = document.getElementById("speedValue");
const pauseBtn = document.getElementById("pauseBtn");
const downloadBtn = document.getElementById("downloadBtn");
const canvas = document.getElementById("artCanvas");
const ctx = canvas.getContext("2d");

const CODE_CHARS = "01{}[]<>/*=+-#$%&@!?;:~^|ABCDEF";
let sourceImage = null;
let pixels = [];
let cellSize = 8;
let animationSpeed = 4;
let running = true;
let time = 0;

// Load selected image
imageInput.addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      sourceImage = img;
      buildPixelData();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// Read image pixels and store exact RGB colors
function buildPixelData() {
  const maxCanvasWidth = Math.min(1200, window.innerWidth * 0.95);
  const scale = Math.min(1, maxCanvasWidth / sourceImage.width);

  const width = Math.max(1, Math.floor(sourceImage.width * scale));
  const height = Math.max(1, Math.floor(sourceImage.height * scale));

  const sampleCanvas = document.createElement("canvas");
  sampleCanvas.width = width;
  sampleCanvas.height = height;

  const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
  sampleCtx.drawImage(sourceImage, 0, 0, width, height);

  const imageData = sampleCtx.getImageData(0, 0, width, height);
  const data = imageData.data;

  pixels = [];

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const index = (y * width + x) * 4;
      const r = data[index];
      const g = data[index + 1];
      const b = data[index + 2];
      const a = data[index + 3];

      pixels.push({
        x,
        y,
        r,
        g,
        b,
        a
      });
    }
  }

  canvas.width = width;
  canvas.height = height;

  cellSize = Number(detailSlider.value);
  time = 0;
}

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  if (!sourceImage || !pixels.length) {
    drawWelcomeScreen();
    return;
  }

  if (!running) return;

  time += animationSpeed * 0.02;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = `${cellSize}px "Courier New", monospace`;
  ctx.textBaseline = "top";

  const columns = Math.ceil(canvas.width / cellSize);
  const rows = Math.ceil(canvas.height / cellSize);

  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < columns; gx++) {
      const px = Math.min(pixels.length - 1, gy * columns + gx);
      const pixel = pixels[px];

      if (!pixel || pixel.a < 20) continue;

      // Flowing brightness effect
      const wave =
        Math.sin(pixel.x * 0.12 + time) *
        Math.cos(pixel.y * 0.12 - time);

      const brightness = 0.72 + wave * 0.28;

      const r = Math.min(255, Math.max(0, Math.round(pixel.r * brightness)));
      const g = Math.min(255, Math.max(0, Math.round(pixel.g * brightness)));
      const b = Math.min(255, Math.max(0, Math.round(pixel.b * brightness)));

      // Character changes smoothly over time
      const charIndex =
        Math.floor(
          Math.abs(
            Math.sin(pixel.x * 0.08 + pixel.y * 0.08 + time)
          ) * CODE_CHARS.length
        ) % CODE_CHARS.length;

      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.fillText(CODE_CHARS[charIndex], gx * cellSize, gy * cellSize);
    }
  }
}

function drawWelcomeScreen() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ffd5";
  ctx.font = "22px monospace";
  ctx.textAlign = "center";
  ctx.fillText("Choose an image to begin", canvas.width / 2, canvas.height / 2);
  ctx.textAlign = "left";
}

// Controls
detailSlider.addEventListener("input", () => {
  detailValue.textContent = detailSlider.value;
  cellSize = Number(detailSlider.value);
});

speedSlider.addEventListener("input", () => {
  speedValue.textContent = speedSlider.value;
  animationSpeed = Number(speedSlider.value);
});

pauseBtn.addEventListener("click", () => {
  running = !running;
  pauseBtn.textContent = running ? "Pause" : "Play";
});

downloadBtn.addEventListener("click", () => {
  if (!sourceImage) return;

  const link = document.createElement("a");
  link.download = "flowing-code-art.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

window.addEventListener("resize", () => {
  if (sourceImage) buildPixelData();
});

// Set initial canvas size
canvas.width = 900;
canvas.height = 550;

animate();
</script>

</body>
</html>
